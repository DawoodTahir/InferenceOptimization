name: Deploy Inference Engine

on:
  push:
    branches: [ "main" ]
    paths:
      - 'InferenceOptimization/**' # Only run if code changes in this folder
      - 'Dockerfile'
  workflow_dispatch: # Allows manual trigger button

env:
  IMAGE_NAME: inference-opt # Your preferred image name

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. FIX THE "NO SPACE LEFT" ERROR
      # This deletes ~20GB of pre-installed tools (Android SDK, .NET, etc)
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # 2. Checkout Code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 3. Set up QEMU (Optional, but good for compatibility)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      # 4. Set up Docker Buildx (The builder engine)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 5. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 6. Build and Push
      # Note: 'context' is set to . (root) because your Dockerfile COPY paths 
      # likely reference 'InferenceOptimization/src' from the root.
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile # Point to where your Dockerfile lives
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
         